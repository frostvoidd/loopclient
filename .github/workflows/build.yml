name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Loom 1.9 needs Gradle 8.x; pin it, the runner default (9.x) breaks the build
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: versions
        run: |
          java -version
          gradle --version

      - name: build
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: loopclient-jar
          path: build/libs/*.jar
          if-no-files-found: warn
